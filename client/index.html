<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gun Storm</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#5aa9e6 0%, #bfe3ff 70%, #eaf6ff 100%) fixed; font-family: "Nunito", "Segoe UI", system-ui, sans-serif; }
    #game { position: fixed; inset: 0; }
    #title { position: fixed; top: 8px; left: 12px; color: #fff; font-weight: 700; text-shadow: 0 1px 3px #0006; pointer-events: none; }
    #debug { position: fixed; top: 8px; right: 12px; color: #fff; background: #0008; padding: 6px 10px; font: 12px/1.4 monospace; white-space: pre; display: none; pointer-events: none; }

    #tuning { position: fixed; top: 40px; left: 12px; width: 300px; background: #000c; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 12px; }
    #tuning label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0; }
    #tuning input { width: 80px; }
    #tuning button { margin: 6px 6px 0 0; }
    .tuning-title { font-weight: 700; margin-bottom: 6px; }

    .overlay { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; z-index: 10; }
    .panel { background: #1e293b; color: #fff; padding: 22px 30px; border-radius: 12px; text-align: center; min-width: 280px; }
    .panel h1, .panel h2 { margin: 0 0 12px; }
    .panel p { margin: 12px 0 6px; opacity: .8; }
    .panel table { margin: 8px auto 14px; border-collapse: collapse; }
    .panel td { padding: 3px 14px; text-align: left; }
    .row { display: flex; gap: 8px; justify-content: center; }
    .panel button { font-size: 16px; padding: 8px 16px; border: 0; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; }
    .panel button:hover { background: #2563eb; }
    #mutebtn { position: fixed; top: 8px; left: 215px; font-size: 12px; padding: 3px 10px; z-index: 5; }
    #menubtn { position: fixed; top: 8px; left: 110px; font-size: 12px; padding: 3px 10px; display: none; }

    .cards { display: flex; flex-wrap: wrap; gap: 8px; }
    .card { flex: 1 1 150px; max-width: 190px; min-width: 150px; background: #0f172a; border: 2px solid transparent; border-radius: 8px; padding: 8px; text-align: left; font-size: 12px; cursor: pointer; }
    .card.sel { border-color: #ffe14d; }
    .card b { font-size: 14px; }
    .bar { height: 5px; background: #fff2; border-radius: 3px; margin: 2px 0 5px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #4ade80; }
    .selrow { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
    .selrow .who { width: 90px; text-align: left; font-weight: 700; }
    .online { min-width: 420px; max-width: 92vw; }
    .online input, .online select { font-size: 15px; padding: 6px 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    .online .err { color: #fca5a5; min-height: 18px; margin-top: 6px; font-size: 14px; }
    .online button:disabled { opacity: .4; cursor: not-allowed; }
    .rooms { max-height: 40vh; overflow-y: auto; text-align: left; }
    .rrow, .mrow, .lrow { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 6px 4px; border-bottom: 1px solid #334155; }
    .mrow > b { flex: 1; text-align: left; }
    .lrow .bar { flex: 1; min-width: 160px; }
    .chat { margin-top: 10px; text-align: left; }
    #chatlog { height: 90px; overflow-y: auto; background: #0f172a; border-radius: 6px; padding: 6px; font-size: 13px; margin-bottom: 6px; }
    #chatin { width: 100%; box-sizing: border-box; }
    table.results th { font-size: 12px; opacity: .7; padding: 3px 10px; }
    .panel select { font-size: 15px; padding: 6px 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    .scroll { max-height: 70vh; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="title"></div>
  <div id="debug"></div>
  <button id="menubtn">Menu (Esc)</button>
  <button id="mutebtn">🔊 Âm thanh</button>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
